name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # This repository is public, so CI logs are world-readable. Everything below is a
  # throwaway credential for an ephemeral service container that is destroyed with the job.
  # No production value may ever be referenced here.
  POSTGRES_PASSWORD: honeydew_ci
  APP_TOKEN_SECRET: ci-app-token-secret-at-least-thirty-two-characters
  PII_LOOKUP_PEPPER: ci-pii-lookup-pepper-at-least-thirty-two-characters
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis needs no database, so it fails fast and independently.
  # ---------------------------------------------------------------------------
  static:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Unit tests are pure logic and need no database either.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx vitest run --project unit --reporter=default --reporter=junit --outputFile=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/unit.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Proves the versioned migrations apply cleanly to an empty database, that the
  # schema has not drifted from them, and that the hand-written constraints the
  # Prisma schema cannot express actually exist afterwards.
  # ---------------------------------------------------------------------------
  migration-rehearsal:
    name: Migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: honeydew
          POSTGRES_PASSWORD: honeydew_ci
          POSTGRES_DB: honeydew_rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U honeydew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew_rehearsal
      DIRECT_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew_rehearsal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Apply migrations to an empty database
        run: npm run db:migrate:deploy

      - name: Fail on schema drift
        # A non-empty diff between the migrated database and the Prisma schema means the
        # migrations no longer produce the schema the application expects.
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Verify database invariants
        run: node scripts/verify-db-constraints.mjs

      - name: Seed is idempotent
        # Seeding twice must not error and must not duplicate configuration.
        run: |
          npm run db:seed
          npm run db:seed

  # ---------------------------------------------------------------------------
  # Destructive integration tests plus the API suite, against disposable databases.
  # The runtime database and the destructive test database are deliberately separate,
  # which is also what the disposable-database guard in test/setup checks for.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration and API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: honeydew
          POSTGRES_PASSWORD: honeydew_ci
          POSTGRES_DB: honeydew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U honeydew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew
      DIRECT_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew
      TEST_DATABASE_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Create the disposable test database
        run: PGPASSWORD=honeydew_ci createdb -h 127.0.0.1 -U honeydew honeydew_test

      - name: Migrate and seed the test database
        env:
          DATABASE_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew_test
          DIRECT_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew_test
        run: |
          npm run db:migrate:deploy
          npm run db:seed

      - name: Verify invariants on the test database
        env:
          DIRECT_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew_test
        run: node scripts/verify-db-constraints.mjs

      - name: Integration tests
        run: npx vitest run --project integration

      - name: API tests
        run: npx vitest run --project api

  # ---------------------------------------------------------------------------
  # Browser tests. The booking and manage-booking suites need a migrated and seeded
  # database or they skip themselves, so the database is set up before Playwright runs.
  # ---------------------------------------------------------------------------
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: honeydew
          POSTGRES_PASSWORD: honeydew_ci
          POSTGRES_DB: honeydew
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U honeydew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew
      DIRECT_URL: postgresql://honeydew:honeydew_ci@127.0.0.1:5432/honeydew
      # The development payment simulator is what lets the browser suite complete a
      # booking. It is refused when NODE_ENV is production, so it cannot leak to a
      # deployed environment.
      ENABLE_DEV_PAYMENT: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Migrate and seed
        run: |
          npm run db:migrate:deploy
          npm run db:seed

      - name: Production build
        # Catches build-time failures that the dev server would not surface. The browser
        # suite itself runs against the dev server until a non-development payment
        # provider exists, because the simulator is disabled in a production build.
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
